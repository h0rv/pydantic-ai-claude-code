[project]
name = "pydantic-ai-claude-code"
version = "0.1.0"
description = "A Pydantic AI model using Claude Code through the public Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "h0rv" }]
dependencies = [
    "anyio>=4.11",
    "claude-agent-sdk>=0.2.176,<0.3",
    "httpx2>=2.16,<3",
    "pydantic-ai-slim[anthropic]>=2.64.0,<3",
]

[project.scripts]
pydantic-ai-claude-code-doctor = "pydantic_ai_claude_code.__main__:main"

[project.optional-dependencies]
sdk = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_claude_code"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.17.0",
    "dirty-equals>=0.11",
    "h11>=0.16",
    "inline-snapshot>=0.36.1",
    "pre-commit>=4.7.0",
    "pydantic-ai-harness>=0.64.0",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-xdist>=3.6.1",
    "ruff>=0.14.14",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E4", "E7", "E9", "F"]
extend-select = ["Q", "RUF100", "RUF018", "RUF043", "C90", "UP", "I", "D", "TID251", "TID253", "PLW1514", "PGH003", "BLE001"]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = ["D100", "D102", "D104", "D105", "D107"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = true
executionEnvironments = [
    { root = "tests", reportUnusedFunction = false, reportPrivateUsage = false, reportPrivateImportUsage = false },
    { root = "src" },
]

[tool.pytest.ini_options]
anyio_mode = "auto"
xfail_strict = true
filterwarnings = ["error"]
faulthandler_timeout = 120
markers = ["live: explicitly opted-in subscription-consuming integration test"]

[tool.coverage.run]
branch = true
source = ["src/pydantic_ai_claude_code"]

[tool.coverage.report]
show_missing = true
